name: Bind short Russian words across portfolio
on:
  push:
    paths: ['.github/workflows/typographic-glue.yml']
permissions:
  contents: write
jobs:
  typography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep short words with following text
        shell: python
        run: |
          from pathlib import Path
          import re
          from html.parser import HTMLParser
          class Glue(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.out=[]; self.skip=[]
              def handle_starttag(self,t,a):
                  self.out.append(self.get_starttag_text())
                  if t in ('script','style','svg','pre','code'): self.skip.append(t)
              def handle_startendtag(self,t,a): self.out.append(self.get_starttag_text())
              def handle_endtag(self,t):
                  self.out.append('</'+t+'>')
                  if self.skip and self.skip[-1]==t: self.skip.pop()
              def handle_data(self,s):
                  if not self.skip:
                      s=re.sub(r'(?<![\w-])(и|а|но|или|в|во|на|к|ко|с|со|у|о|об|обо|от|до|по|из|за|для|без|при|под|над|не|ни)\s+(?=\S)', lambda m:m[1]+'\u00a0',s,flags=re.I)
                  self.out.append(s)
              def handle_entityref(self,n): self.out.append('&'+n+';')
              def handle_charref(self,n): self.out.append('&#'+n+';')
              def handle_decl(self,d): self.out.append('<!'+d+'>')
              def handle_comment(self,d): self.out.append('<!--'+d+'-->')
          for name in ['index.html','bank/index.html','hmi/index.html','mendi/index.html','pitboard/index.html']:
              p=Path(name)
              if not p.exists(): continue
              before=p.read_text()
              parser=Glue(); parser.feed(before); after=''.join(parser.out)
              for pattern in [r'<script[^>]*>.*?</script>',r'<style[^>]*>.*?</style>',r'<svg[^>]*>.*?</svg>',r'(?:src|href|poster)="[^"]*"']:
                  assert re.findall(pattern,before,re.S)==re.findall(pattern,after,re.S), name
              p.write_text(after)
              print(name, 'updated' if before!=after else 'unchanged')
          Path('.github/workflows/typographic-glue.yml').unlink()
      - name: Commit typography update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html bank/index.html hmi/index.html mendi/index.html pitboard/index.html .github/workflows/typographic-glue.yml
          git commit -m "Keep Russian prepositions and conjunctions with following words"
          git push
